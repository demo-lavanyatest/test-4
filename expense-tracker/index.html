<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <p class="subtitle">Track your daily spending and manage your budget</p>
    </header>

    <section class="summary-cards" aria-label="Financial Summary">
      <div class="card total-card">
        <span class="card-label">Total Expenses</span>
        <span class="card-value" id="total-amount">$0.00</span>
      </div>
      <div class="card count-card">
        <span class="card-label">Total Transactions</span>
        <span class="card-value" id="total-count">0</span>
      </div>
    </section>

    <div class="main-grid">
      <!-- Add Expense Form -->
      <section class="panel form-panel">
        <h2>Add Expense</h2>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="expense-desc">Description</label>
            <input
              type="text"
              id="expense-desc"
              name="description"
              placeholder="e.g. Grocery shopping"
              autocomplete="off"
              required
            />
            <span class="error-msg" id="desc-error"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expense-amount">Amount ($)</label>
              <input
                type="number"
                id="expense-amount"
                name="amount"
                step="0.01"
                min="0.01"
                placeholder="0.00"
                required
              />
              <span class="error-msg" id="amount-error"></span>
            </div>

            <div class="form-group">
              <label for="expense-category">Category</label>
              <select id="expense-category" name="category" required>
                <option value="" disabled selected>Select category</option>
                <option value="Food & Dining">Food & Dining</option>
                <option value="Transportation">Transportation</option>
                <option value="Housing & Utilities">Housing & Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
                <option value="Health & Medical">Health & Medical</option>
                <option value="Other">Other</option>
              </select>
              <span class="error-msg" id="category-error"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="expense-date">Date</label>
            <input type="date" id="expense-date" name="date" required />
            <span class="error-msg" id="date-error"></span>
          </div>

          <button type="submit" id="add-btn" class="primary-btn">Add Expense</button>
        </form>
      </section>

      <!-- Expense List & Filters -->
      <section class="panel list-panel">
        <div class="panel-header">
          <h2>Expenses History</h2>
          <div class="filter-group">
            <label for="filter-category" class="sr-only">Filter by category</label>
            <select id="filter-category">
              <option value="ALL">All Categories</option>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Transportation">Transportation</option>
              <option value="Housing & Utilities">Housing & Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Shopping">Shopping</option>
              <option value="Health & Medical">Health & Medical</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="table-container">
          <table class="expense-table" aria-label="List of expenses">
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th class="text-right">Amount</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody id="expense-list-body">
              <!-- Dynamically populated -->
            </tbody>
          </table>
          <p id="empty-state" class="empty-state hidden">No expenses recorded yet. Add one above!</p>
        </div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
