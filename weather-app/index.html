<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Forecast</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="weather-container">
    <header class="weather-header">
      <h1>Current Weather</h1>
      <p class="subtitle">Search any city worldwide for live conditions</p>
    </header>

    <form id="search-form" class="search-form" novalidate>
      <div class="search-bar">
        <label for="city-input" class="sr-only">City Name</label>
        <input
          type="text"
          id="city-input"
          name="city"
          placeholder="Enter city name (e.g. London, Tokyo, New York)..."
          autocomplete="off"
          required
        />
        <button type="submit" id="search-btn" class="search-btn">Get Weather</button>
      </div>
      <div id="error-message" class="error-banner hidden" role="alert" aria-live="assertive"></div>
    </form>

    <div id="loading-indicator" class="loading-state hidden" role="status" aria-live="polite">
      <div class="spinner"></div>
      <p>Fetching current weather data...</p>
    </div>

    <section id="weather-result" class="weather-card hidden" aria-live="polite">
      <div class="location-header">
        <div>
          <h2 id="location-name">—</h2>
          <p id="location-region" class="location-region">—</p>
        </div>
        <span id="weather-updated" class="updated-badge">—</span>
      </div>

      <div class="primary-weather">
        <div class="temp-display">
          <span id="weather-icon" class="weather-icon" aria-hidden="true">☀️</span>
          <span id="temperature" class="temperature">—</span>
          <span class="temp-unit">°C</span>
        </div>
        <p id="weather-condition" class="condition-text">—</p>
      </div>

      <div class="weather-details">
        <div class="detail-item">
          <span class="detail-label">Feels Like</span>
          <span id="feels-like" class="detail-value">—</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Humidity</span>
          <span id="humidity" class="detail-value">—</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Wind Speed</span>
          <span id="wind-speed" class="detail-value">—</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Coordinates</span>
          <span id="coordinates" class="detail-value">—</span>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
