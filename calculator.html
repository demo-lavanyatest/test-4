<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="calculator.css" />
</head>
<body>
  <main class="calc" aria-labelledby="title">
    <h1 id="title" class="sr-only">Calculator</h1>

    <div class="display">
      <div class="expression" id="expression" aria-hidden="true"></div>
      <output class="result" id="result" aria-live="polite" aria-atomic="true">0</output>
      <p class="error" id="error" role="alert"></p>
    </div>

    <div class="keys" role="group" aria-label="Calculator keypad">
      <button type="button" class="key fn" data-action="clear" aria-label="Clear all">AC</button>
      <button type="button" class="key fn" data-action="backspace" aria-label="Delete last character">&#9003;</button>
      <button type="button" class="key fn" data-action="sign" aria-label="Toggle sign">&plusmn;</button>
      <button type="button" class="key op" data-op="/" aria-label="Divide">&divide;</button>

      <button type="button" class="key num" data-num="7">7</button>
      <button type="button" class="key num" data-num="8">8</button>
      <button type="button" class="key num" data-num="9">9</button>
      <button type="button" class="key op" data-op="*" aria-label="Multiply">&times;</button>

      <button type="button" class="key num" data-num="4">4</button>
      <button type="button" class="key num" data-num="5">5</button>
      <button type="button" class="key num" data-num="6">6</button>
      <button type="button" class="key op" data-op="-" aria-label="Subtract">&minus;</button>

      <button type="button" class="key num" data-num="1">1</button>
      <button type="button" class="key num" data-num="2">2</button>
      <button type="button" class="key num" data-num="3">3</button>
      <button type="button" class="key op" data-op="+" aria-label="Add">+</button>

      <button type="button" class="key num wide" data-num="0">0</button>
      <button type="button" class="key num" data-num="." aria-label="Decimal point">.</button>
      <button type="button" class="key equals" data-action="equals" aria-label="Equals">=</button>
    </div>

    <p class="hint">Tip: you can also type numbers and use + &minus; * / , Enter and Backspace.</p>
  </main>

  <script src="calculator.js"></script>
</body>
</html>
