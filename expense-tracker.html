<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="expense-tracker.css" />
</head>
<body>
  <main class="app" aria-labelledby="title">
    <h1 id="title">Expense Tracker</h1>

    <section class="total-card" aria-label="Total expenses">
      <span class="total-label">Total expenses</span>
      <span class="total-value" id="total">$0.00</span>
    </section>

    <form id="expense-form" novalidate>
      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required aria-describedby="amount-error" />
        <span class="error" id="amount-error" role="alert"></span>
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Choose a category</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>
        <span class="error" id="category-error" role="alert"></span>
      </div>

      <button type="submit" class="primary">Add expense</button>
    </form>

    <section class="list-section" aria-labelledby="list-title">
      <h2 id="list-title">Expenses</h2>
      <p class="empty" id="empty-state" hidden>No expenses yet. Add your first one above.</p>
      <ul class="expense-list" id="expense-list"></ul>
    </section>
  </main>

  <script src="expense-tracker.js"></script>
</body>
</html>
