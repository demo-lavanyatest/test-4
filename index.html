<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error" />
        <span class="error" id="email-error" role="alert"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" aria-describedby="password-error" />
          <button type="button" id="toggle-password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <span class="error" id="password-error" role="alert"></span>
      </div>

      <div class="row">
        <label class="checkbox"><input type="checkbox" name="remember" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="primary">Sign in</button>
      <p class="status" id="form-status" role="status" aria-live="polite"></p>
    </form>

    <p class="footer">Don't have an account? <a href="#">Sign up</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
